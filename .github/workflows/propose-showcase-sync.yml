name: Propose showcase update

on:
  push:
    branches: [codex/showcase-sync]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: propose-showcase-update
  cancel-in-progress: false

jobs:
  open-pull-request:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REVIEW_BRANCH: codex/showcase-sync
    steps:
      - name: Publish verified showcase update
        run: |
          set -euo pipefail
          pr_number="$(gh pr list --repo "${GH_REPO}" --head "${REVIEW_BRANCH}" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "${pr_number}" ]; then
            gh pr create --repo "${GH_REPO}" --head "${REVIEW_BRANCH}" --base main --title "Sync sanitized public showcase" --body "Generated, sanitized, and tested by the private source repository automation."
            pr_number="$(gh pr list --repo "${GH_REPO}" --head "${REVIEW_BRANCH}" --base main --state open --json number --jq '.[0].number')"
          fi
          gh pr merge --repo "${GH_REPO}" "${pr_number}" --squash --delete-branch
