name: Propose showcase update

on:
  push:
    branches: [codex/showcase-sync]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: propose-showcase-update
  cancel-in-progress: false

jobs:
  open-pull-request:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REVIEW_BRANCH: codex/showcase-sync
    steps:
      - name: Open pull request when needed
        run: |
          set -euo pipefail
          open_count="$(gh pr list --repo "${GH_REPO}" --head "${REVIEW_BRANCH}" --state open --json number --jq length)"
          if [ "${open_count}" = "0" ]; then
            gh pr create --repo "${GH_REPO}" --head "${REVIEW_BRANCH}" --base main --title "Sync sanitized public showcase" --body "Generated from the private source repository. Review the sanitized diff before merging."
          fi
